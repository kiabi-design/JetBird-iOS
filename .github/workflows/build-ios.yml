name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

env:
  RUST_VERSION: "1.100.0"

jobs:
  build:
    name: Build JetBird iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ─── Checkout ───
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── Setup Rust ───
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: jetbird-rust-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          working-directory: ./rust-core

      # ─── Show Xcode version (use default) ───
      - name: Show Xcode version
        run: xcodebuild -version

      # ─── Build Rust Core (XCFramework) ───
      - name: Build Rust SPAKE2 core
        working-directory: ./rust-core
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-C target-cpu=native"

      # ─── Verify XCFramework ───
      - name: Verify XCFramework created
        run: |
          ls -la Frameworks/JetBirdSpake2.xcframework/
          file Frameworks/JetBirdSpake2.xcframework/ios-arm64/JetBirdSpake2
          file Frameworks/JetBirdSpake2.xcframework/ios-arm64_x86_64-simulator/JetBirdSpake2

      # ─── Build Swift Package ───
      - name: Build Swift package
        run: |
          swift build -c release --arch arm64

      # ─── Generate Xcode Project ───
      - name: Generate Xcode project
        run: |
          swift package generate-xcodeproj

      # ─── Build .app with xcodebuild ───
      - name: Build .app for device (unsigned)
        run: |
          xcodebuild -project JetBird.xcodeproj \
            -scheme JetBirdApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/JetBird.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # ─── Package as .ipa ───
      - name: Create unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/JetBirdApp.app build/Payload/
          cd build
          zip -r JetBird.ipa Payload/
          ls -la JetBird.ipa

      # ─── Upload Artifact ───
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetBird-iOS-${{ github.ref_name }}
          path: build/JetBird.ipa
          retention-days: 30

      # ─── Create Release (on tag push) ───
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/JetBird.ipa
          generate_release_notes: true
          draft: false
          prerelease: false

      # ─── Also upload XCFramework separately ───
      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetBirdSpake2-xcframework
          path: Frameworks/JetBirdSpake2.xcframework
          retention-days: 30