name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JetBird iOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: jetbird-${{ hashFiles('rust-core/Cargo.toml', 'rust-core/Cargo.lock') }}

      - name: Build Rust SPAKE2 core (XCFramework)
        working-directory: rust-core
        run: ./build.sh

      - name: Verify XCFramework
        run: |
          set -euo pipefail
          test -d Frameworks/JetBirdSpake2.xcframework
          find Frameworks/JetBirdSpake2.xcframework -name '*.a' -print -exec file {} \;
          find Frameworks/JetBirdSpake2.xcframework -name 'module.modulemap' -print

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project JetBird.xcodeproj \
            -scheme JetBird \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned .ipa
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/JetBird.app"
          test -d "$APP"
          rm -rf build/Payload build/JetBird.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qr JetBird.ipa Payload)
          ls -la build/JetBird.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetBird-iOS-${{ github.ref_name }}
          path: build/JetBird.ipa
          retention-days: 30

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetBirdSpake2-xcframework
          path: Frameworks/JetBirdSpake2.xcframework
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/JetBird.ipa
          generate_release_notes: true
