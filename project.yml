name: JetBird
options:
  bundleIdPrefix: com.jetbird
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  JetBird:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # SPAKE2 (RFC 9382, P-256) from nueex/JetBird, built on BearSSL
      - path: native
      - path: third_party/bearssl
        includes:
          - "src/ec/ec_p256_m31.c"
          - "src/codec/ccopy.c"
          - "src/inner.h"
          - "src/config.h"
          - "inc/*.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jetbird.ios
        PRODUCT_NAME: JetBird
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/Core/JetBird-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/native/include"
          - "$(SRCROOT)/third_party/bearssl/inc"
          - "$(SRCROOT)/third_party/bearssl/src"
        GCC_C_LANGUAGE_STANDARD: gnu11
        OTHER_CFLAGS:
          - "-fvisibility=hidden"
    dependencies:
      - sdk: Security.framework
      - sdk: Network.framework
